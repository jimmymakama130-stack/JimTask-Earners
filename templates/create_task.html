{% extends "base.html" %}

{% block title %}Create Task - JimTask Earners{% endblock %}

{% block content %}

<div class="card shadow-lg border-0">
    <div class="card-header bg-success text-white">
        <h3><i class="fas fa-plus-circle"></i> Create Task</h3>
    </div>

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Task Title</label>
                <input type="text" name="title" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Task Description</label>
                <textarea name="description" class="form-control" rows="4" required></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Task Link</label>
                <input type="url" name="link" class="form-control" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Reward (₦)</label>
                    <input type="number" name="amount" class="form-control" min="1" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Workers Needed</label>
                    <input type="number" name="workers_needed" class="form-control" min="1" required>
                </div>
            </div>

            <button type="submit" class="btn btn-success w-100">
                <i class="fas fa-save"></i> Create Task
            </button>

        </form>

    </div>
</div>

{% endblock %}
